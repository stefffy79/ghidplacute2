<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f18" />
    <title>EuroPlate — Identifică plăcuța</title>
    <style>
      :root {
        --bg: #0b0f18;
        --panel: #131825;
        --border: #222d45;
        --accent: #3b82f6;
        --green: #10b981;
        --amber: #f59e0b;
        --red: #ef4444;
        --text: #e2e8f0;
        --muted: #7c8aa3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
        min-height: 100vh;
        padding: 16px;
        max-width: 640px;
        margin: 0 auto;
        padding-top: max(16px, env(safe-area-inset-top));
      }
      h1 {
        font-size: 1.15rem;
        margin-bottom: 2px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .lbl {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 14px 0 7px;
      }
      .lbl:first-child {
        margin-top: 0;
      }
      .step {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        background: var(--accent);
        color: #fff;
        border-radius: 50%;
        font-size: 0.72rem;
        font-weight: 700;
        margin-right: 7px;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: #0b0f18;
        color: var(--text);
        font-size: 1.05rem;
      }
      input[type="text"] {
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
      }
      input[type="text"].csearch {
        letter-spacing: normal;
        text-transform: none;
        text-align: left;
        font-size: 1rem;
        margin-bottom: 2px;
      }
      .combo {
        position: relative;
      }
      .cclear {
        position: absolute;
        right: 6px;
        top: 6px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
      }
      .cclear:hover {
        color: var(--text);
      }
      .clist {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        z-index: 60;
        max-height: 300px;
        overflow-y: auto;
        background: #0b0f18;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-top: 4px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        -webkit-overflow-scrolling: touch;
      }
      .citem {
        padding: 12px;
        cursor: pointer;
        font-size: 1.02rem;
      }
      .citem + .citem {
        border-top: 1px solid var(--border);
      }
      .citem.active,
      .citem:hover {
        background: #1b2436;
      }
      .citem .cc {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: 6px;
      }
      .cempty {
        padding: 12px;
        color: var(--red);
      }
      button.go {
        display: block;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 9px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        margin-top: 18px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sw {
        width: 42px;
        height: 36px;
        border-radius: 7px;
        border: 2px solid #0006;
        cursor: pointer;
        position: relative;
      }
      .sw.on {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.35);
      }
      .bopt {
        padding: 9px 13px;
        border-radius: 9px;
        border: 2px solid var(--border);
        background: #0b0f18;
        color: var(--text);
        font-size: 0.9rem;
        cursor: pointer;
      }
      .bopt.on {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.35);
        color: #fff;
      }
      .sw span {
        position: absolute;
        bottom: -16px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.6rem;
        color: var(--muted);
      }
      .verdict {
        border-radius: 10px;
        padding: 13px;
        margin-bottom: 12px;
        font-weight: 600;
        line-height: 1.5;
      }
      .v-ok {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid var(--green);
      }
      .v-warn {
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid var(--amber);
      }
      .v-bad {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid var(--red);
      }
      .big {
        font-size: 1.15rem;
        font-weight: 800;
      }
      .miniplate {
        display: inline-block;
        font-weight: 800;
        letter-spacing: 1px;
        padding: 5px 12px;
        border-radius: 5px;
        border: 1px solid #0003;
        margin: 6px 0;
        font-size: 1rem;
      }
      .platebox {
        background: #e9edf3;
        border-radius: 8px;
        padding: 9px;
        margin-bottom: 7px;
        text-align: center;
      }
      .secmatch {
        border-color: var(--green);
        box-shadow: 0 0 0 1px var(--green) inset;
      }
      .secdim {
        opacity: 0.5;
      }
      .tag {
        background: var(--green);
        color: #04120b;
        font-size: 0.62rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 7px;
        vertical-align: middle;
      }
      .sec {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px;
        margin-top: 10px;
      }
      .sectype {
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 4px;
      }
      .secdesc {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
      }
      .swatch-inline {
        display: inline-block;
        width: 16px;
        height: 12px;
        border-radius: 3px;
        border: 1px solid #0006;
        vertical-align: middle;
        margin: 0 3px;
      }
      .muted {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>🔍 EuroPlate — Identifică plăcuța</h1>
    <div class="sub">
      Scrie țara (sau lasă gol pentru căutare în toate țările), pune numărul,
      alege culorile → afli ce plăcuță este.
    </div>

    <div class="card">
      <div class="lbl"><span class="step">1</span>Țara</div>
      <div class="combo">
        <input
          type="text"
          id="countryInput"
          class="csearch"
          autocomplete="off"
          autocapitalize="off"
          placeholder="🌍 Nu știu — caută prin toate țările"
          role="combobox"
          aria-expanded="false"
        />
        <button
          type="button"
          id="countryClear"
          class="cclear"
          aria-label="Șterge țara"
          hidden
        >
          ×
        </button>
        <div id="countryList" class="clist" role="listbox" hidden></div>
      </div>
      <select id="country" hidden></select>

      <div class="lbl"><span class="step">2</span>Numărul de pe plăcuță</div>
      <input
        id="number"
        type="text"
        placeholder="ex. B 12 ABC"
        autocomplete="off"
      />

      <div class="lbl"><span class="step">3</span>Culoarea fondului</div>
      <div class="swatches" id="bgSw"></div>

      <div class="lbl" style="margin-top: 24px">Culoarea caracterelor</div>
      <div class="swatches" id="fgSw"></div>

      <div class="lbl" style="margin-top: 24px">
        Banda din stânga
        <span style="color: var(--muted); font-weight: 400">(opțional)</span>
      </div>
      <div class="swatches" id="bandSw"></div>

      <button class="go" id="go">Identifică</button>
    </div>

    <div class="card" id="resultCard" style="display: none">
      <div id="result"></div>
    </div>

    <script>
      // ============================================================================
      //  plate-decoder.js  —  motorul de decodare (extras din decodorul original)
      //  Rule set + scoring identice cu aplicatia web. Ruleaza in browser SI in Node.
      //  Intrare: un string cu numarul de inmatriculare (ex. "B 12 ABC").
      //  Iesire:  { input, matches:[{code,name,flag,category,region,prob}], residual }
      // ============================================================================

      const DEC_RULES = [
        {
          code: "RO",
          cat: "Seria Standard",
          pattern: /^B[\s\-·]?(\d{2,3})[\s\-·]?([A-Z]{3})$/,
        },
        {
          code: "RO",
          cat: "Seria Standard",
          pattern: /^([A-Z]{2})[\s\-·]?(\d{2,3})[\s\-·]?([A-Z]{3})$/,
          rf: (m) => m[1],
        },
        {
          code: "RO",
          cat: "Ministerul Afacerilor Interne (MAI)",
          pattern: /^MAI[\s\-·]?(\d{3,5})$/,
        },
        {
          code: "RO",
          cat: "Corp Diplomatic (CD)",
          pattern: /^CD[\s\-·]?(\d{6})$/,
        },

          code: "RO",
          cat: "Transport Consular (TC)/Consul Onorific (CO)",
          pattern: /^(TC|CO)[\s\-·]?(\d{6})$/,
        },
        {
          code: "RO",
          cat: "Vehicule de Probe (PROBE)",
          pattern: /^(B|[A-Z]{2})[\s\-·]?(\d{3,5})[\s\-·]?PROBE$/,
          rf: (m) => m[1],
        },
        {
          code: "RO",
          cat: "Inmatriculare Temporara Export",
          pattern: /^([A-Z]{2})[\s\-·]?(\d{2,3})[\s\-·]?T$/,

        },
        { code: "RO", cat: "Armata Romaniei", pattern: /^A[\s\-·]?(\d{3,7})$/ },
        {
          code: "RO",
          cat: "Marcaj forta pe placuta militara A (FA/ALA)",
          pattern: /^(FA|ALA)[\s\-·]?(\d{2,5})$/,
        },
        {
          code: "RO",
          cat: "Numere Temporare/Rosii",
          pattern: /^(?!CD|CO|TC)(B|[A-Z]{2})[\s\-·]?(0\d{2,5})$/,
          rf: (m) => m[1],
        },
        {
          code: "RO",
          cat: "Transport Public/Export-Leasing (galben/rosu)",
          pattern: /^(B|[A-Z]{2})[\s\-·]?(\d{5})$/,
          rf: (m) => m[1],
        },
        {
          code: "D",
          cat: "Seria Standard",
          pattern: /^([A-ZÄÖÜ]{1,3})[\s\-·]?([A-Z]{1,2})[\s\-·]?(\d{1,4})$/,

        {

        {

          code: "GB",

        },
        {

        {

          pattern: /^([A-Z])[\s\-·]?([A-Z]{2})[\s\-·]?(\d{1,4})$/,

        {

            /^([A-HJ-NPR-TV-Z]{2})[\s\-·]?(\d{3})[\s\-·]?([A-HJ-NPR-TV-Z]{2})$/,

        {

        },
        {

        {

        {

        {

        {

        {

          cat: "Penitenciare (BA)",

        },
        {
          code: "H",

          pattern: /^Y[A-Z]{2}[\s\-·]?(\d{3})$/,
        },
        {
          code: "H",
          cat: "Protocol (PRTKL)",
          pattern: /^PRTKL[\s\-·]?(\d{1,2})$/,
        },
        {
          code: "H",
          cat: "Oldtimer (OT)",
          pattern: /^OT[\s\-·]?(\d{2})[\s\-·]?(\d{2})$/,
        },
        {

        },
        {
          code: "AZ",
          cat: "Seria Standard",

        },
        {

          cat: "Seria Standard",

        },
        {
          code: "CY",
          cat: "Seria Standard",

        {
          code: "GBZ",
          cat: "Seria Standard (din 2001)",
          pattern: /^GBZ[\s\-·]?(\d{3,4})$/,

        },

        {

        },
        {

        },
        {

        },
        {

      function plateVisual(country, s) {
        if (country && country.code === "RO") {
          var iro =
            typeof RO_SECTION_IMG !== "undefined"
              ? RO_SECTION_IMG[s.type]
              : null;
          if (iro) {
            var mw = s.type === "Plăcuță motocicletă" ? 150 : 340;
            return (
              '<div class="platebox"><img src="' +
              iro +
              '" alt="' +
              esc(s.type || "Plăcuță") +
              '" loading="lazy" style="width:100%;max-width:' +
              mw +
              'px;height:auto;display:block;border-radius:6px"/></div>'
            );
          }
        }
        if (country && country.code === "D") {
          var idx = country.sections.indexOf(s);
          if (idx >= 0 && DE_CFGS[idx])
            return (
              '<div class="platebox">' + renderPlate(DE_CFGS[idx]) + "</div>"
            );
        }
        if (country && country.code === "PL") {
          var ip = country.sections.indexOf(s);
          if (ip >= 0 && PL_CFGS[ip])
            return (
              '<div class="platebox">' + renderPlatePL(PL_CFGS[ip]) + "</div>"
            );
        }
        if (country && country.code === "SK") {
          var isk = country.sections.indexOf(s);
          if (isk >= 0 && SK_CFGS[isk]) {
            var svg = renderPlateSK(SK_CFGS[isk]);
            if (svg) return '<div class="platebox">' + svg + "</div>";
          }
        }
        if (country && country.code === "NL") {
          var inl = country.sections.indexOf(s);
          if (inl >= 0 && NL_CFGS[inl]) {
            var svgn = renderPlateNL(NL_CFGS[inl]);
            if (svgn) return '<div class="platebox">' + svgn + "</div>";
          }
        }
        if (country && country.code === "E") {
          var ies = country.sections.indexOf(s);
          if (ies >= 0 && ES_CFGS[ies]) {
            var svge = renderPlateES(ES_CFGS[ies]);
            if (svge) return '<div class="platebox">' + svge + "</div>";
          }
        }
        return (
          '<div class="miniplate" style="background:' +
          s.bg +
          ";color:" +
          s.fg +
          '">' +
          esc(s.type || "Plăcuță") +
          "</div>"
        );
      }

      var renderPlateES = (function () {

      // ---- Culori ----
      var PAL = [

      var BANDS = [
        { v: "ue", n: "🔵 UE (stele)" },
        { v: "nat", n: "🔵 Națională" },
        { v: "none", n: "Fără bandă" },
      ];
      var BANDMAP = {

        opt: "opțională/variabilă",

      function buildSw(container, which) {

          d.innerHTML = "<span>" + p.n + "</span>";

            var cur = which === "bg" ? pickBg : pickFg;
            if (cur === p.n) {
              which === "bg" ? (pickBg = null) : (pickFg = null);
            } else {
              which === "bg" ? (pickBg = p.n) : (pickFg = p.n);

      function buildBand(container) {

      buildBand($("bandSw"));

      function colorName(hex) {
        hex = (hex || "").replace("#", "");

            .split("")
            .map(function (x) {
              return x + x;

            .join("");

          g = parseInt(hex.slice(2, 4), 16),

      // ---- Identifică ----

      $("go").addEventListener("click", runAnalyze);

      };
      function runAnalyze() {

        var html = "";

        // ========== MOD: TOATE ȚĂRILE (după probabilitate) ==========

          html += '<div class="big">🌍 Căutare în toate țările</div>';

              return (

                cls +
                '">' +
                plateVisual(country, s) +
                '<div class="sectype">' +
                esc(s.type || "Plăcuță") +
                tag +
                "</div>" +
                (s.description
                  ? '<div class="secdesc">' + esc(s.description) + "</div>"
                  : "") +
                euro +
                bandInfo +
                "</div>"
              );
            })
            .join("");
        }

        if (!number && !pickBg && !pickFg && !pickBand) {
          html +=
            '<div class="muted">Scrie un număr și/sau alege culorile ca să primești un răspuns.</div>';
        }

        $("result").innerHTML = html;
        $("resultCard").style.display = "block";
        $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    </script>
  </body>
</html>
